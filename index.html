<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Wallet - Safe Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --primary: #4A90E2; --income: #2ECC71; --expense: #E74C3C; --bg: #F0F2F5; 
            --kbank-bg: #E8F5E9; --kbank-text: #138B2E;
            --bay-bg: #FFF9E6; --bay-text: #B8860B;
            --scb-bg: #F3E5F5; --scb-text: #4E2E7F;
            --cash-bg: #F5F5F5; --cash-text: #616161;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; width: 100vw; overflow: hidden; }
        .container { width: 100%; max-width: 500px; background: white; height: 100%; display: flex; flex-direction: column; position: relative; }

        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; height: 100%; width: 100%; background: white; position: absolute; z-index: 100; }
        .login-box { width: 100%; text-align: center; }
        .login-box h2 { color: var(--primary); font-size: 2.5em; margin: 0; }
        .login-box input { width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #EEE; border-radius: 12px; font-size: 1.1em; text-align: center; }

        #app-content { display: none; flex-direction: column; height: 100%; width: 100%; }
        .app-header { padding: 15px; background: white; border-bottom: 1px solid #EEE; flex-shrink: 0; }
        .scroll-content { flex-grow: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }

        .total-balance { background: linear-gradient(135deg, #333, #555); color: white; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 15px; }
        .total-balance h4 { margin: 0; opacity: 0.8; font-weight: 300; font-size: 0.8em; }
        .total-balance h2 { margin: 5px 0 0; font-size: 1.8em; }

        .wallet-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .wallet-box { padding: 8px; border-radius: 12px; text-align: center; color: white; font-size: 0.7em; }
        .wallet-box p { margin: 3px 0 0; font-weight: 600; font-size: 1em; }

        .form-container { background: #F9F9F9; padding: 15px; border-radius: 15px; margin: 15px 0; }
        .form-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Prompt'; font-size: 0.9em; background: #EEE; color: #666; }
        .tab-btn.active { background: var(--primary); color: white; }

        form { display: flex; flex-direction: column; gap: 8px; }
        input, select, button { padding: 10px; border: 1px solid #DDD; border-radius: 10px; font-family: 'Prompt'; font-size: 1em; }
        button.btn-main { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; padding: 12px; }

        .item-card { padding: 12px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid transparent; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-kbank { background: var(--kbank-bg); border-left-color: var(--kbank-text); }
        .item-bay { background: var(--bay-bg); border-left-color: var(--bay-text); }
        .item-scb { background: var(--scb-bg); border-left-color: var(--scb-text); }
        .item-cash { background: var(--cash-bg); border-left-color: var(--cash-text); }

        .acc-tag { font-size: 0.6em; padding: 2px 8px; border-radius: 10px; color: white; font-weight: 600; margin-top: 4px; display: inline-block; }
        .delete-btn { background: rgba(231, 76, 60, 0.1); color: var(--expense); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .section-title { font-weight: 600; color: #333; margin: 20px 0 10px; border-left: 4px solid var(--primary); padding-left: 10px; font-size: 1em; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <div class="login-box">
            <h2>💰 My Wallet</h2>
            <input type="password" id="user-pass" placeholder="รหัสผ่านของคุณ" autofocus>
            <button class="btn-main" style="width:100%" onclick="login()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div id="app-content">
        <div class="app-header">
            <div class="total-balance">
                <h4>ยอดเงินรวมทั้งหมด</h4>
                <h2 id="total-balance">฿0.00</h2>
            </div>
            <div class="wallet-container">
                <div class="wallet-box" style="background:#138B2E">กสิกร<p id="bal-kbank">฿0</p></div>
                <div class="wallet-box" style="background:#DAA520; color:#333">กรุงศรี<p id="bal-bay">฿0</p></div>
                <div class="wallet-box" style="background:#4E2E7F">ไทยพาณิชย์<p id="bal-scb">฿0</p></div>
                <div class="wallet-box" style="background:#7F8C8D">เงินสด<p id="bal-cash">฿0</p></div>
            </div>
        </div>

        <div class="scroll-content">
            <div class="form-container">
                <div class="form-tabs">
                    <button class="tab-btn active" id="tab-normal" onclick="switchForm('normal')">บันทึกทั่วไป</button>
                    <button class="tab-btn" id="tab-transfer" onclick="switchForm('transfer')">โอนเงิน</button>
                </div>

                <form id="form-normal">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <select id="account">
                            <option value="kbank">กสิกร</option>
                            <option value="bay">กรุงศรี</option>
                            <option value="scb">ไทยพาณิชย์</option>
                            <option value="cash">เงินสด</option>
                        </select>
                        <select id="type">
                            <option value="income">รายรับ (+)</option>
                            <option value="expense" selected>รายจ่าย (-)</option>
                        </select>
                    </div>
                    <input type="text" id="text" placeholder="ระบุรายการ..." required>
                    <input type="number" id="amount" placeholder="0.00" required step="0.01">
                    <input type="date" id="date-normal" required>
                    <button type="submit" class="btn-main">บันทึกข้อมูล</button>
                </form>

                <form id="form-transfer" style="display:none;">
                    <div style="display:grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;">
                        <select id="from-account">
                            <option value="kbank">จากกสิกร</option>
                            <option value="bay">จากกรุงศรี</option>
                            <option value="scb">จากไทยพาณิชย์</option>
                            <option value="cash">จากเงินสด</option>
                        </select>
                        <span style="font-size: 1.2em;">➡️</span>
                        <select id="to-account">
                            <option value="scb">ไปไทยพาณิชย์</option>
                            <option value="kbank">ไปกสิกร</option>
                            <option value="bay">ไปกรุงศรี</option>
                            <option value="cash">ไปเงินสด</option>
                        </select>
                    </div>
                    <input type="number" id="transfer-amount" placeholder="จำนวนเงินที่โอน" required step="0.01">
                    <input type="date" id="date-transfer" required>
                    <button type="submit" class="btn-main" style="background:#555;">ยืนยันการโอนเงิน</button>
                </form>
            </div>

            <h3 class="section-title">🕒 ประวัติรายการทั้งหมด (เรียงตามข้อมูลล่าสุด)</h3>
            <div id="list"></div>
            
            <button onclick="logout()" style="width:100%; background:none; border:none; color:#999; text-decoration:underline; margin:30px 0; cursor:pointer;">ออกจากระบบ</button>
        </div>
    </div>
</div>

<script>
    // --- Config Firebase ---
    const firebaseConfig = {
        apiKey: "AIzaSyBATLcMZbMuQmnIlG0edT0EPs4FCSWEets",
        authDomain: "mymoney-c730b.firebaseapp.com",
        databaseURL: "https://mymoney-c730b-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "mymoney-c730b",
        storageBucket: "mymoney-c730b.firebasestorage.app",
        messagingSenderId: "1086026909674",
        appId: "G-289LBX9897"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let userKey = "";
    let transactions = [];

    const accNames = { kbank: "กสิกร", bay: "กรุงศรี", scb: "ไทยพาณิชย์", cash: "เงินสด" };
    const accColors = { kbank: "#138B2E", bay: "#DAA520", scb: "#4E2E7F", cash: "#7F8C8D" };

    function formatMoney(num) { return Number(num).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    // ดักจับปุ่ม Enter หน้าจอล็อกอิน
    document.addEventListener('DOMContentLoaded', () => {
        const passInput = document.getElementById('user-pass');
        if(passInput) {
            passInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { login(); }
            });
        }
    });

    function switchForm(mode) {
        document.getElementById('form-normal').style.display = mode === 'normal' ? 'flex' : 'none';
        document.getElementById('form-transfer').style.display = mode === 'transfer' ? 'flex' : 'none';
        document.getElementById('tab-normal').className = mode === 'normal' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-transfer').className = mode === 'transfer' ? 'tab-btn active' : 'tab-btn';
    }

    function login() {
        const pass = document.getElementById('user-pass').value;
        if (!pass) return;
        userKey = btoa(pass);
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        
        setupDefaultDate();
        initAppListeners(); // ลงทะเบียนฟอร์มหลังจากสกรีนแอปเปิดชัวร์ๆ
        loadData();
    }
    
    // 🛠️ แก้ไขจุดตายของปุ่ม: นำ Event Listener มาผูกในนี้เพื่อป้องกันปุ่มบันทึกค้าง/กดไม่ติด
    function initAppListeners() {
        const formNormal = document.getElementById('form-normal');
        formNormal.onsubmit = (e) => {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('amount').value);
            const newData = {
                account: document.getElementById('account').value,
                text: document.getElementById('text').value,
                amount: document.getElementById('type').value === 'expense' ? -Math.abs(amt) : Math.abs(amt),
                date: document.getElementById('date-normal').value
            };
            db.ref('users/' + userKey).push(newData);
            document.getElementById('text').value = '';
            document.getElementById('amount').value = '';
            setupDefaultDate();
        };

        const formTransfer = document.getElementById('form-transfer');
        formTransfer.onsubmit = (e) => {
            e.preventDefault();
            const from = document.getElementById('from-account').value;
            const to = document.getElementById('to-account').value;
            const amt = Math.abs(parseFloat(document.getElementById('transfer-amount').value));
            const date = document.getElementById('date-transfer').value;

            if (from === to) { alert('บัญชีต้นทางและปลายทางต้องต่างกัน'); return; }

            db.ref('users/' + userKey).push({ account: from, text: `🔄 โอนเงินไป ${accNames[to]}`, amount: -amt, date: date });
            db.ref('users/' + userKey).push({ account: to, text: `🔄 รับโอนจาก ${accNames[from]}`, amount: amt, date: date });

            document.getElementById('transfer-amount').value = '';
            switchForm('normal');
            setupDefaultDate();
        };
    }
    
    // 🛠️ แก้ไขระบบอ่านข้อมูล: ไม่สนเงื่อนไขวันที่ใดๆ ทั้งสิ้น ดึงคีย์ตรงๆ จากกล่อง 1003 ปลอดภัย 100%
    function loadData() {
        if(!userKey) return;
        db.ref('users/' + userKey).on('value', (snapshot) => {
            const data = snapshot.val();
            transactions = [];
            
            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    if (item && typeof item === 'object') {
                        // ปล่อยผ่านทุกค่าวันที่ ไม่ยอมให้ระบบล่มเพราะฟอร์แมตวันที่ผิดเพี้ยน
                        transactions.push({
                            fbKey: key,
                            account: item.account || 'cash',
                            text: item.text || 'ไม่ระบุรายการ',
                            amount: item.amount, 
                            date: item.date || 'ไม่ระบุวันที่'
                        });
                    }
                });
            }
            renderUI();
        });
    }

    function renderUI() {
        const list = document.getElementById('list');
        if (!list) return;
        list.innerHTML = ''; 
        
        let total = 0, kbank = 0, bay = 0, scb = 0, cash = 0;

        transactions.forEach(t => {
            const amt = parseFloat(t.amount) || 0;
            total += amt;
            if (t.account === 'kbank') kbank += amt;
            if (t.account === 'bay') bay += amt;
            if (t.account === 'scb') scb += amt;
            if (t.account === 'cash') cash += amt;
        });

        document.getElementById('total-balance').innerText = '฿' + formatMoney(total);
        document.getElementById('bal-kbank').innerText = '฿' + formatMoney(kbank);
        document.getElementById('bal-bay').innerText = '฿' + formatMoney(bay);
        document.getElementById('bal-scb').innerText = '฿' + formatMoney(scb);
        document.getElementById('bal-cash').innerText = '฿' + formatMoney(cash);

        // แสดงรายการจากล่างขึ้นบน (ข้อมูลใหม่ล่าสุดอยู่บนสุด)
        const displayList = [...transactions].reverse();
        
        displayList.forEach(t => {
            const amt = parseFloat(t.amount) || 0;
            const card = document.createElement('div');
            card.className = `item-card item-${t.account}`;
            card.innerHTML = `
                <div>
                    <strong>${t.text}</strong><br>
                    <small style="color:#888">วันที่บันทึก: ${t.date}</small><br>
                    <span class="acc-tag" style="background:${accColors[t.account] || '#7F8C8D'}">${accNames[t.account] || 'เงินสด'}</span>
                </div>
                <div style="text-align:right; display:flex; align-items:center; gap:10px;">
                    <span style="font-weight:600; color:${amt > 0 ? '#2ECC71' : '#E74C3C'}">${amt > 0 ? '+' : ''}${formatMoney(amt)}</span>
                    <button class="delete-btn" onclick="deleteData('${t.fbKey}')">✕</button>
                </div>`;
            list.appendChild(card);
        });
    }

    function deleteData(key) { 
        if(confirm('ลบรายการนี้ใช่หรือไม่?')) {
            db.ref('users/' + userKey + '/' + key).remove(); 
        }
    }
    
    function logout() { location.reload(); }

    function setupDefaultDate() {
        try {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const localDate = `${y}-${m}-${d}`;
            
            const dNormal = document.getElementById('date-normal');
            const dTransfer = document.getElementById('date-transfer');
            if(dNormal) dNormal.value = localDate;
            if(dTransfer) dTransfer.value = localDate;
        } catch(e) {}
    }
</script>
</body>
</html>
